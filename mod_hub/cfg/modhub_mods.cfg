// ============================================================
//  HL2 Mod Hub - 模组登记表
//
//  在引擎内"解析"其他模组的方式之一：
//  把你想在中心里切换的模组登记到下面的列表里。
//  每个条目一行：  alias modhub_run_<名字> "echo ..."
//
//  注意：起源引擎不允许在游戏运行中直接加载另一个模组进程，
//  切换模组需要退出后用 -game <模组名> 重新启动引擎。
//  本文件为方便控制台操作而提供别名。
// ============================================================

// 示例：modhub_run_my_mod "echo 请在桌面端使用: hl2.exe -game my_mod"
alias modhub_help "echo [ModHub] 运行模组：退出游戏后执行 hl2.exe -game <模组名>"
alias modhub_list "dir games"

// 把下面的每一行按实际情况填写（一个模组一行）
// alias modhub_run_YourModName "echo [ModHub] 退出后用 hl2.exe -game YourModName 启动"
