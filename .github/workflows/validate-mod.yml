name: validate-mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: 校验模组文件夹结构与 gameinfo.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验模组结构
        run: |
          python3 - <<'EOF'
          import re, sys
          from pathlib import Path

          root = Path("mod_hub")
          errors = []

          # 1) gameinfo.txt 存在且含必要字段
          gi = root / "gameinfo.txt"
          if not gi.exists():
              errors.append("缺少 mod_hub/gameinfo.txt")
          else:
              text = gi.read_text(encoding="utf-8")
              for key in ["SteamAppId", "SearchPaths", "FileSystem"]:
                  if key not in text:
                      errors.append(f"gameinfo.txt 缺少 {key}")
              if "Game" not in text:
                  errors.append("gameinfo.txt 缺少 SearchPaths 中的 Game 定义")
              m = re.search(r'"?SteamAppId"?\s*"?(\d+)"?', text)
              if not m or m.group(1) != "220":
                  errors.append("SteamAppId 应为 220 (Half-Life 2)")

          # 2) cfg 文件
          for cfg in ["autoexec.cfg", "modhub_mods.cfg"]:
              if not (root / "cfg" / cfg).exists():
                  errors.append(f"缺少 cfg/{cfg}")

          # 3) 地图源文件
          if not (root / "maps" / "mod_hub.vmf").exists():
              errors.append("缺少 maps/mod_hub.vmf")
          else:
              vmf = (root / "maps" / "mod_hub.vmf").read_text(encoding="utf-8")
              if vmf.count("solid") < 6:
                  errors.append("mod_hub.vmf 固体数量异常")

          # 4) C++ 核心源码（含 Lua VM 与 Lua 运行时）
          for f in ["src/ModHubCore/modhub_core.h",
                    "src/ModHubCore/modhub_core.cpp",
                    "src/ModHubCore/gma_parser.h",
                    "src/ModHubCore/gma_parser.cpp",
                    "src/ModHubCore/lua_vm.h",
                    "src/ModHubCore/lua_vm.cpp",
                    "src/ModHubCore/modhub_cli.cpp",
                    "src/ModHubCore/lua/lua.h",
                    "src/ModHubCore/lua/COPYRIGHT",
                    "src/ModHubCore/mod_scanner_test.cpp"]:
              if not Path(f).exists():
                  errors.append(f"缺少 {f}")

          # 5) Lua 运行时文件数（官方 Lua 5.1.5 源码，剔除独立入口）
          lua_c = list((Path("src/ModHubCore/lua")).glob("*.c"))
          expect = {"lua.c", "luac.c", "print.c"}
          core = [p for p in lua_c if p.name not in expect]
          if len(core) < 25:
              errors.append(f"Lua 运行时源文件数异常: {len(core)}")
          for must in ["lapi.c", "lauxlib.c", "lstrlib.c", "lvm.c", "lstate.c"]:
              if not (Path("src/ModHubCore/lua") / must).exists():
                  errors.append(f"缺少 Lua 运行时源文件 {must}")

          if errors:
              print("校验失败:")
              for e in errors:
                  print("  -", e)
              sys.exit(1)
          print("模组结构校验通过: gameinfo.txt / cfg / maps / C++ 核心 全部就绪")
          EOF
