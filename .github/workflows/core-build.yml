name: core-build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-x64:
    name: 编译+测试 模组解析核心 (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 编译 Lua 运行时（官方 Lua 5.1.5）
        run: |
          mkdir -p /tmp/luaobjs
          for f in src/ModHubCore/lua/*.c; do
            case "$f" in *lua.c|*luac.c|*print.c) continue ;; esac
            gcc -std=c99 -O2 -w -c "$f" -o "/tmp/luaobjs/$(basename "${f%.c}").o"
          done
          echo "lua objects: $(ls /tmp/luaobjs | wc -l)"
      - name: 编译并运行单元测试（含 Lua VM）
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra \
              src/ModHubCore/mod_scanner_test.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjs/*.o -lm -o /tmp/modhub_test
          /tmp/modhub_test
      - name: 编译并运行模组内置 GMA 加载器测试（gma_loader）
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Isrc/ModHubCore \
              src/ModHubEngine/modhub_loader_test.cpp src/ModHubEngine/gma_loader.cpp \
              src/ModHubCore/gma_parser.cpp -o /tmp/modhub_loader_test
          /tmp/modhub_loader_test
      - name: 编译 modhub_cli（静态链接，单文件）
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -static \
              src/ModHubCore/modhub_cli.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjs/*.o -lm -o /tmp/modhub_cli-linux-x64
          file /tmp/modhub_cli-linux-x64
          /tmp/modhub_cli-linux-x64 2>&1 | head -2
      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: modhub_cli-linux-x64
          path: /tmp/modhub_cli-linux-x64
          if-no-files-found: error

  build-arm64:
    name: 交叉编译 模组解析核心 (Linux ARM64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 ARM64 交叉编译器
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu
      - name: 交叉编译 + 链接（验证 ARM 架构可用）
        run: |
          mkdir -p /tmp/luaobjsa
          for f in src/ModHubCore/lua/*.c; do
            case "$f" in *lua.c|*luac.c|*print.c) continue ;; esac
            aarch64-linux-gnu-gcc -std=c99 -O2 -w -c "$f" -o "/tmp/luaobjsa/$(basename "${f%.c}").o"
          done
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra \
              src/ModHubCore/mod_scanner_test.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjsa/*.o -lm -o /tmp/modhub_test_arm64
          file /tmp/modhub_test_arm64
      - name: 交叉编译模组内置 GMA 加载器测试（ARM64）
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -Isrc/ModHubCore \
              src/ModHubEngine/modhub_loader_test.cpp src/ModHubEngine/gma_loader.cpp \
              src/ModHubCore/gma_parser.cpp -o /tmp/modhub_loader_test_arm64
          file /tmp/modhub_loader_test_arm64
      - name: 编译 modhub_cli（ARM64 静态链接，可在 Termux/安卓运行）
        run: |
          aarch64-linux-gnu-g++ -std=c++17 -O2 -Wall -Wextra -static \
              src/ModHubCore/modhub_cli.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjsa/*.o -lm -o /tmp/modhub_cli-linux-arm64
          file /tmp/modhub_cli-linux-arm64
      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: modhub_cli-linux-arm64
          path: /tmp/modhub_cli-linux-arm64
          if-no-files-found: error

  build-windows:
    name: 交叉编译 模组解析核心 (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 MinGW 交叉编译器
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64
      - name: 交叉编译 + 链接（验证 Windows 可用）
        run: |
          mkdir -p /tmp/luaobjsw
          for f in src/ModHubCore/lua/*.c; do
            case "$f" in *lua.c|*luac.c|*print.c) continue ;; esac
            x86_64-w64-mingw32-gcc -std=c99 -O2 -w -c "$f" -o "/tmp/luaobjsw/$(basename "${f%.c}").o"
          done
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra \
              src/ModHubCore/mod_scanner_test.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjsw/*.o -o /tmp/modhub_test_win.exe
          file /tmp/modhub_test_win.exe
      - name: 交叉编译模组内置 GMA 加载器测试（Windows）
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -Isrc/ModHubCore \
              src/ModHubEngine/modhub_loader_test.cpp src/ModHubEngine/gma_loader.cpp \
              src/ModHubCore/gma_parser.cpp -o /tmp/modhub_loader_test_win.exe
          file /tmp/modhub_loader_test_win.exe
      - name: 编译 modhub_cli（Windows 静态链接，单 exe）
        run: |
          x86_64-w64-mingw32-g++ -std=c++17 -O2 -Wall -Wextra -static \
              src/ModHubCore/modhub_cli.cpp src/ModHubCore/modhub_core.cpp \
              src/ModHubCore/gma_parser.cpp src/ModHubCore/lua_vm.cpp \
              /tmp/luaobjsw/*.o -o /tmp/modhub_cli-windows-x64.exe
          file /tmp/modhub_cli-windows-x64.exe
      - name: 上传 CLI 产物
        uses: actions/upload-artifact@v4
        with:
          name: modhub_cli-windows-x64
          path: /tmp/modhub_cli-windows-x64.exe
          if-no-files-found: error

  build-aml-mod:
    name: 云编译 安卓注入模组 (AML, arm64-v8a + armeabi-v7a)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Android NDK r25c
        run: |
          curl -sSL -o /tmp/ndk.zip https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q /tmp/ndk.zip -d /opt
          ls /opt/android-ndk-r25c/ndk-build
      - name: 同步纯逻辑源码并编译 AML 模组
        run: |
          bash src/AMLMod/prepare.sh
          /opt/android-ndk-r25c/ndk-build \
            NDK_PROJECT_PATH=$PWD/src/AMLMod \
            APP_BUILD_SCRIPT=$PWD/src/AMLMod/jni/Android.mk \
            NDK_APPLICATION_MK=$PWD/src/AMLMod/jni/Application.mk \
            NDK_OUT=/tmp/amlobj NDK_LIBS_OUT=/tmp/amllibs
          echo "--- 产物 ---"
          find /tmp/amllibs -name '*.so' -exec file {} \;
      - name: 上传 AML 模组产物
        uses: actions/upload-artifact@v4
        with:
          name: modhub_aml
          path: /tmp/amllibs/**/libmodhub_aml.so
          if-no-files-found: error

  package-content:
    name: 打包 mod_hub 内容层
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 打包模组内容层
        run: |
          (cd mod_hub && zip -r ../mod_hub-content.zip .)
          ls -la mod_hub-content.zip
      - name: 上传内容层产物
        uses: actions/upload-artifact@v4
        with:
          name: mod_hub-content
          path: mod_hub-content.zip
          if-no-files-found: error

  release:
    name: 发布 GitHub Release（tag v*）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-x64, build-arm64, build-windows, build-aml-mod, package-content]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 列出产物
        run: ls -laR dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**
          generate_release_notes: true
